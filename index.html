        ...OMN_ILLUSIONIST_COMMON,
        ...OMN_RUNEBLADE_COMMON,
        ...OMN_WIZARD_COMMON,
      ];

      // Full common pool for the "1 anything" wildcard slot (incl. equipment + lightning/generic)
      const OMN_ANY_COMMON = [
        ...OMN_ILLUSIONIST_COMMON,
        ...OMN_RUNEBLADE_COMMON,
        ...OMN_WIZARD_COMMON,
        ...OMN_LIGHTNING_GENERIC_COMMON,
        ...OMN_COMMON_EQUIPMENT,
      ];

      // 8 packs per OMN sealed pool
      for (let i = 0; i < 8; i++) {
        // 1 guaranteed from each class pool
        OMN_CLASS_POOLS.forEach(pool => {
          deck.push(...sample(pool, 1));
        });

        // 3 wild class commons (independent draws from combined illu+rune+wiz pool)
        deck.push(...sample(OMN_ANY_CLASS_COMMON, 3));

        // 1 wildcard common — anything in the common tier (incl equipment, lightning/generic)
        const wildCard = sample(OMN_ANY_COMMON, 1)[0];
        if (OMN_COMMON_EQUIPMENT.includes(wildCard)) {
          equipment.push(wildCard);
        } else {
          deck.push(wildCard);
        }

        // 3 Lightning/Generic commons
        deck.push(...sample(OMN_LIGHTNING_GENERIC_COMMON, 3));

        // 1 equipment
        equipment.push(...sample(OMN_COMMON_EQUIPMENT, 1));

        // Rare slot 1: always rare
        deck.push(...sample(OMN_ALL_RARES, 1));

        // Rare slot 2: 1/7 majestic, else rare
        const rareRoll = Math.random();
        if (rareRoll < 1 / 7) {
          deck.push(...sample(OMN_MAJESTIC, 1));
        } else {
          deck.push(...sample(OMN_ALL_RARES, 1));
        }

        // Rainbow foil slot (no equipment in foil pool)
        deck.push(...sample(OMN_FOIL_POOL, 1));
      }

      // Class count summary
      var classCount = {};
      deck.forEach((card) => {
        if (OMN_ILLUSIONIST_COMMON.includes(card) || OMN_ILLUSIONIST_RARE.includes(card)) {
          classCount["Illusionist"] = (classCount["Illusionist"] || 0) + 1;
        } else if (OMN_RUNEBLADE_COMMON.includes(card) || OMN_RUNEBLADE_RARE.includes(card)) {
          classCount["Runeblade"] = (classCount["Runeblade"] || 0) + 1;
        } else if (OMN_WIZARD_COMMON.includes(card) || OMN_WIZARD_RARE.includes(card)) {
          classCount["Wizard"] = (classCount["Wizard"] || 0) + 1;
        } else {
          classCount["Lightning/Generic/Maj/Equip"] = (classCount["Lightning/Generic/Maj/Equip"] || 0) + 1;
        }
      });
      console.log("Class counts:", classCount);

      const countCards = list =>
        list.reduce((acc, card) => {
          acc[card] = (acc[card] || 0) + 1;
          return acc;
        }, {});

      // Prefer OMN_PRINT_CODES mapping for Fabrary URLs; fall back to slugified name
      const fabraryCode = card => OMN_PRINT_CODES[card] || cleanCardName(card);

      const output = [];
      const fabraryOutput = [];
      const now = new Date();
      const formattedDate = now.toLocaleDateString("en-US", { year: 'numeric', month: 'long', day: 'numeric' });

      output.push("Player Name / ID\tOMN_SEALED");
      output.push(`Date\t${formattedDate}`);
      output.push("Event\tOMN Sealed Training");
      output.push("Format\tSealed Deck");
      fabraryOutput.push("&name=OMN_SEALED&format=sealed");
      output.push("Hero / Class\tAurora, Emissary of Lightning (Runeblade)");
      fabraryOutput.push("OMN048");
      output.push("Result\t1st\n");
      output.push("\nArena cards\n1x Scorpio, Comet Tail\n");
      fabraryOutput.push("OMN049");

      output.push("Equipment:");
      for (const [card, qty] of Object.entries(countCards(equipment))) {
        output.push(`${qty}x ${card}`);
        fabraryOutput.push(...Array(qty).fill(fabraryCode(card)));
      }

      output.push("\nDeck cards:");
      for (const [card, qty] of Object.entries(countCards(deck))) {
        output.push(`${qty}x ${card}`);
        fabraryOutput.push(...Array(qty).fill(fabraryCode(card)));
      }

      document.getElementById("output").textContent = output.join("\n");
      document.getElementById("fabraryLink").href = "https://fabrary.net/decks?tab=import".concat(fabraryOutput.join("&cards="));
    }
  });
}

    
    function copyToClipboard() {
      const output = document.getElementById("output").textContent;
      navigator.clipboard.writeText(output).then(() => {
        alert("Deck copied to clipboard!");
      }).catch(err => {
        alert("Failed to copy: " + err);
      });
    }
  </script>
</body>
